<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPO法人グローバルブリッジ — 境界を、橋に変える。</title>
<meta name="description" content="佐賀から世界へ。教育・国際協力・環境保全・子どもの健全育成・平和推進を通じて、誰も取り残さない未来を築きます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Sans+JP:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#fafaf7;--panel:#ffffff;--ink:#111111;--ink-soft:#555555;
  --line:rgba(17,17,17,0.1);--line-2:rgba(17,17,17,0.18);
  --accent:oklch(0.65 0.16 145);--accent-soft:oklch(0.94 0.04 145);
  --hf:'Inter','Zen Kaku Gothic New',system-ui,sans-serif;
  --parallax-offset:0px;
}
body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,system-ui,'Noto Sans JP',sans-serif;overflow-x:hidden;font-feature-settings:"palt","ss01";line-height:1.6;letter-spacing:-0.005em}
body::-webkit-scrollbar{width:8px}
body::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2);border-radius:4px}
[data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
[data-reveal][data-revealed]{opacity:1;transform:none}
[data-reveal-delay="1"]{transition-delay:.06s}
[data-reveal-delay="2"]{transition-delay:.12s}
[data-reveal-delay="3"]{transition-delay:.18s}
[data-reveal-delay="4"]{transition-delay:.24s}

/* ── Nav ── */
.vc-nav{position:sticky;top:0;z-index:50;padding:16px 32px;display:grid;grid-template-columns:280px 1fr auto;gap:24px;align-items:center;background:transparent;backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
.vc-nav.scrolled{background:rgba(250,250,247,0.85);border-bottom-color:var(--line)}
.vc-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.vc-logo svg{width:36px;height:36px;flex-shrink:0}
.vc-logo .name{font-size:15px;font-weight:600;letter-spacing:-0.01em;line-height:1.1}
.vc-logo .sub{display:block;font-size:9px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-top:2px}
.vc-nav-mid{display:flex;gap:24px;justify-content:center}
.vc-nav-mid a{color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;opacity:.8}
.vc-nav-mid a:hover{opacity:1}
.vc-nav-r{display:flex;gap:12px;align-items:center}
.vc-lang{display:inline-flex;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:11px;font-family:'JetBrains Mono',monospace}
.vc-lang button{background:transparent;border:none;padding:4px 10px;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-size:inherit;border-radius:6px}
.vc-lang button.on{background:var(--ink);color:var(--bg)}
.vc-cta-nav{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center;gap:6px}
.vc-cta-nav:hover{background:oklch(0.3 0.04 250)}
.vc-pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:vc-pulse 2s infinite;flex-shrink:0}
@keyframes vc-pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Buttons ── */
.vc-btn{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent}
.vc-btn-pri{background:var(--bg);color:var(--ink)}
.vc-btn-pri:hover{transform:translateY(-1px)}
.vc-btn-sec{background:transparent;color:var(--bg);border-color:rgba(255,255,255,0.3)}
.vc-btn-sec:hover{background:rgba(255,255,255,0.1)}

/* ── Hero ── */
.vc-hero{padding:12px 32px}
.vc-hero-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:380px 180px;gap:12px}
.vc-h-main{grid-column:span 8;grid-row:span 2;padding:40px;background:var(--ink);color:var(--bg);border-radius:24px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:1px solid transparent}
.vc-h-main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 60% at 90% 20%,oklch(0.55 0.15 25 / 0.5),transparent 60%),radial-gradient(ellipse 60% 50% at 10% 90%,oklch(0.55 0.16 250 / 0.5),transparent 60%),radial-gradient(ellipse 50% 40% at 60% 60%,oklch(0.65 0.14 145 / 0.3),transparent 60%);transform:translateY(var(--parallax-offset));pointer-events:none}
.vc-h-meta{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;opacity:.7;display:flex;gap:24px;position:relative;z-index:1;text-transform:uppercase}
.vc-h-title-wrap{position:relative;z-index:1}
.vc-h-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;opacity:.8;margin-bottom:24px;display:inline-flex;align-items:center;gap:8px}
.vc-h-eye::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
.vc-h-title{font-family:var(--hf);font-size:clamp(48px,5vw,88px);line-height:1;letter-spacing:-0.04em;margin:0;font-weight:500}
.vc-h-title .l1{display:block}
.vc-h-title .l2{display:block;color:var(--accent-soft);font-weight:400}
.vc-h-sub{margin-top:24px;font-size:16px;opacity:.85;max-width:52ch;line-height:1.6;margin-bottom:0}
.vc-h-actions{display:flex;gap:10px;margin-top:28px}
.vc-h-img{grid-column:span 4;grid-row:span 1;border-radius:24px;position:relative;overflow:hidden;background:#1a1a1a}
.vc-h-img img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.noise{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,0.06) 0 1px,transparent 1px 8px)}
.vc-h-stat{grid-column:span 2;padding:22px;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.vc-h-stat .num{font-size:56px;line-height:1;letter-spacing:-0.04em;font-weight:500}
.vc-h-stat .lab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
.vc-h-cta-card{grid-column:span 2;padding:22px;border-radius:24px;background:var(--accent-soft);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:background .2s;text-decoration:none;color:var(--ink)}
.vc-h-cta-card:hover{background:oklch(0.9 0.06 145)}
.vc-h-cta-card .lab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.vc-h-cta-card .ttl{font-size:18px;font-weight:500;line-height:1.2;letter-spacing:-0.01em}
.vc-h-cta-card .arr{align-self:flex-end;font-size:22px}

/* ── Marquee ── */
.vc-marquee{padding:12px 32px}
.vc-marquee-inner{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 0;overflow:hidden;white-space:nowrap}
.vc-marquee-track{display:inline-flex;gap:36px;animation:vc-mq 40s linear infinite;font-size:13px;font-weight:500}
@keyframes vc-mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.vc-marquee-track .item{display:inline-flex;gap:8px;align-items:center}
.vc-marquee-track .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vc-marquee-track .sep{color:var(--ink-soft)}

/* ── Stats ── */
.vc-stats{padding:12px 32px}
.vc-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vc-stat-card{padding:24px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.vc-stat-card .num{font-size:64px;line-height:1;letter-spacing:-0.04em;font-weight:500}
.vc-stat-card .lab{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin-top:8px;text-transform:uppercase}

/* ── Section header ── */
.vc-sh{padding:60px 32px 24px;display:flex;justify-content:space-between;align-items:end;gap:32px}
.vc-sh-l{max-width:60ch}
.vc-sh-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;display:inline-flex;gap:8px;align-items:center}
.vc-sh-eye::before{content:'';width:6px;height:6px;border-radius:2px;background:var(--ink)}
.vc-sh-title{font-family:var(--hf);font-size:44px;line-height:1.05;letter-spacing:-0.03em;margin:12px 0 0;font-weight:500}
.vc-sh-aside{font-size:14px;color:var(--ink-soft);max-width:36ch;line-height:1.6}

/* ── Programs ── */
.vc-progs{padding:12px 32px}
.vc-progs-grid{display:grid;grid-template-columns:360px 1fr;gap:12px}
.vc-progs-list{display:flex;flex-direction:column;gap:8px}
.vc-prog-item{padding:18px 20px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:background .25s,transform .25s;display:flex;align-items:center;gap:14px}
.vc-prog-item:hover{transform:translateX(4px)}
.vc-prog-item.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vc-prog-item .num{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.6;min-width:28px}
.vc-prog-item .swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.vc-prog-item .ttl{font-size:16px;font-weight:500;flex:1}
.vc-prog-item .arr{font-size:16px;opacity:.5}
.vc-prog-item.active .arr{opacity:1}
.vc-prog-detail{padding:40px;border-radius:18px;position:relative;overflow:hidden;color:white;min-height:480px;display:flex;flex-direction:column;justify-content:space-between;transition:background .4s ease}
.vc-prog-detail::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 80% 20%,rgba(255,255,255,0.18),transparent 60%);pointer-events:none}
.vc-prog-detail-top{position:relative;z-index:1;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.vc-prog-detail-mid{position:relative;z-index:1;max-width:720px}
.vc-prog-detail-mid .ttl{font-size:64px;line-height:1.05;letter-spacing:-0.03em;font-weight:500;margin:0 0 20px}
.vc-prog-detail-mid .body{font-size:18px;line-height:1.6;opacity:.9;max-width:56ch}
.vc-prog-detail-bot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:end}
.vc-prog-detail .vc-btn{background:rgba(255,255,255,0.15);color:white;border-color:rgba(255,255,255,0.3);backdrop-filter:blur(10px)}
.vc-prog-detail .vc-btn:hover{background:rgba(255,255,255,0.25)}

/* ── About ── */
.vc-about{padding:24px 32px}
.vc-about-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vc-about-img-card{aspect-ratio:1/1;border-radius:18px;overflow:hidden;position:relative;background:#e8e4df}
.vc-about-img-card img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.vc-about-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.vc-about-card h2{font-size:48px;line-height:1.05;letter-spacing:-0.03em;margin:16px 0 24px;font-weight:500}
.vc-about-card .body{font-size:15px;color:var(--ink-soft);line-height:1.8;white-space:pre-line}
.vc-about-card .sig{margin-top:24px;font-size:14px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em}

/* ── Reports ── */
.vc-reports{padding:12px 32px}
.vc-reports-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vc-report{border-radius:18px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform .25s,border-color .25s;display:flex;flex-direction:column;overflow:hidden;min-height:220px}
.vc-report:hover{transform:translateY(-4px);border-color:var(--line-2)}
.vc-report-thumb{width:100%;height:140px;object-fit:cover;object-position:center;display:block;flex-shrink:0}
.vc-report-body{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.vc-report-meta{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
.vc-report-tag-pill{padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.vc-report-title{font-size:16px;font-weight:500;line-height:1.4;letter-spacing:-0.005em;flex:1}
.vc-report-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft)}

/* ── CTA ── */
.vc-cta-section{padding:24px 32px}
.vc-cta-card{padding:64px;border-radius:24px;position:relative;overflow:hidden;background:var(--ink);color:var(--bg);display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:end}
.vc-cta-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 40% 60% at 80% 20%,oklch(0.55 0.15 25 / 0.6),transparent 60%),radial-gradient(ellipse 50% 50% at 10% 80%,oklch(0.55 0.15 250 / 0.6),transparent 60%);pointer-events:none}
.vc-cta-card>*{position:relative;z-index:1}
.vc-cta-card h2{font-size:64px;line-height:1.05;letter-spacing:-0.03em;margin:16px 0 24px;font-weight:500}
.vc-cta-card .body{font-size:17px;opacity:.85;max-width:48ch;line-height:1.6}
.vc-cta-actions{display:flex;flex-direction:column;gap:10px}
.vc-cta-card .vc-btn-pri{background:var(--bg);color:var(--ink)}
.vc-cta-card .vc-btn-sec{background:transparent;color:var(--bg);border-color:rgba(255,255,255,0.3)}

/* ── Org ── */
.vc-org{padding:12px 32px}
.vc-org-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.vc-org-card{padding:24px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.vc-org-card.col3{grid-column:span 3}
.vc-org-card.col6{grid-column:span 6}
.vc-org-card .k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px}
.vc-org-card .v{font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-0.01em}
.vc-org-card.col6 .v{font-size:14px;font-weight:400;line-height:1.7;color:var(--ink-soft)}

/* ── Footer ── */
.vc-footer{padding:60px 32px 24px}
.vc-footer-card{padding:48px;border-radius:24px;background:var(--ink);color:var(--bg)}
.vc-footer-tag{font-size:clamp(48px,6vw,96px);line-height:1;letter-spacing:-0.03em;font-weight:500}
.vc-footer-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:40px;padding-top:48px;margin-top:48px;border-top:1px solid rgba(255,255,255,0.15)}
.vc-footer-col h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin:0 0 16px;opacity:.7}
.vc-footer-col p,.vc-footer-col a{font-size:13px;margin:0 0 8px;text-decoration:none;color:var(--bg);display:block;opacity:.85}
.vc-footer-col a:hover{opacity:1}
.vc-footer-bottom{padding-top:32px;margin-top:48px;border-top:1px solid rgba(255,255,255,0.15);display:flex;justify-content:space-between;font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;opacity:.65}
</style>
</head>

function mount() {
  if (removeScroll) removeScroll();

  const lang = state.lang;
  document.documentElement.lang = lang === 'jp' ? 'ja' : 'en';
  document.title = lang === 'jp'
    ? 'NPO法人グローバルブリッジ — 境界を、橋に変える。'
    : 'Global Bridge NPO — Turning borders into bridges.';

  document.getElementById('app').innerHTML = buildPage(lang);

  // Scroll effects
  const nav = document.getElementById('main-nav');
  function onScroll() {
    const y = window.scrollY;
    nav.classList.toggle('scrolled', y > 30);
    document.documentElement.style.setProperty('--parallax-offset', (y * 0.08) + 'px');
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  removeScroll = () => window.removeEventListener('scroll', onScroll);
  onScroll();

  // Reveal on scroll
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.setAttribute('data-revealed',''); });
  }, { threshold: 0.12 });
  document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));

  // Program selector
  document.querySelectorAll('[data-prog]').forEach(item => {
    item.addEventListener('click', () => {
      const idx = +item.dataset.prog;
      state.activeProgIdx = idx;
      const p = SITE.programs[state.lang][idx];
      document.querySelectorAll('[data-prog]').forEach((el,j) => el.classList.toggle('active', j===idx));
      const detail = document.getElementById('prog-detail');
      detail.style.background = `oklch(0.42 0.14 ${p.hue})`;
      document.getElementById('pd-code').textContent = `—— ${p.code} / ${p.tag}`;
      document.getElementById('pd-count').textContent = `0${idx+1} of 0${SITE.programs[state.lang].length}`;
      document.getElementById('pd-title').textContent = p.title;
      document.getElementById('pd-body').textContent = p.body;
    });
  });

  // Language toggle
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      const newLang = btn.dataset.lang;
      if (newLang && newLang !== state.lang) {
        const y = window.scrollY;
        state.lang = newLang;
        mount();
        window.scrollTo(0, y);
      }
    });
  });
}

mount();
</script>
