<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPO法人グローバルブリッジ — 境界を、橋に変える。</title>
<meta name="description" content="佐賀から世界へ。教育・国際協力・環境保全・子どもの健全育成・平和推進を通じて、誰も取り残さない未来を築きます。">
<meta property="og:title" content="NPO法人グローバルブリッジ">
<meta property="og:description" content="佐賀から世界へ。誰も取り残さない未来を築きます。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fafaf8;color:#1a1a1a;font-family:'Noto Sans JP','Inter',-apple-system,sans-serif;overflow-x:hidden;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

:root{
  --green-900:#0d3320;
  --green-800:#1b5e3b;
  --green-700:#256b45;
  --green-600:#2e7d52;
  --green-200:#a8d5bc;
  --green-100:#d4edd e;
  --green-50:#edf7f2;
  --orange:#c94a1a;
  --orange-h:#b53f14;
  --cream:#fafaf8;
  --gray-900:#111827;
  --gray-700:#374151;
  --gray-500:#6b7280;
  --gray-300:#d1d5db;
  --gray-100:#f3f4f6;
  --white:#ffffff;
  --serif:'Noto Serif JP',Georgia,serif;
  --sans:'Noto Sans JP','Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.06);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.08);
  --radius:16px;
  --radius-sm:10px;
  --max-w:1200px;
  --pad:clamp(24px,5vw,80px);
}

/* ── Reveal animation ── */
[data-reveal]{opacity:0;transform:translateY(28px);transition:opacity .75s cubic-bezier(.2,.8,.2,1),transform .75s cubic-bezier(.2,.8,.2,1)}
[data-reveal][data-revealed]{opacity:1;transform:none}
[data-reveal-delay="1"]{transition-delay:.1s}
[data-reveal-delay="2"]{transition-delay:.2s}
[data-reveal-delay="3"]{transition-delay:.3s}
[data-reveal-delay="4"]{transition-delay:.4s}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 var(--pad);height:68px;display:flex;align-items:center;justify-content:space-between;gap:32px;transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.nav.scrolled{background:rgba(250,250,248,.92);backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-logo-icon{width:38px;height:38px;background:var(--green-800);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-logo-icon svg{width:22px;height:22px;stroke:#fff;fill:none}
.nav-logo-text .en{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--green-800);line-height:1.1;letter-spacing:-.01em}
.nav-logo-text .jp{font-size:10px;color:var(--gray-500);letter-spacing:.12em;font-family:var(--mono)}
.nav-links{display:flex;gap:28px}
.nav-links a{font-size:13px;font-weight:500;color:var(--gray-700);opacity:.85;transition:opacity .2s,color .2s}
.nav-links a:hover{opacity:1;color:var(--green-800)}
.nav-right{display:flex;gap:10px;align-items:center}
.nav-lang{display:flex;padding:3px;background:var(--gray-100);border-radius:8px}
.nav-lang button{background:none;border:none;padding:4px 10px;font-size:11px;font-family:var(--mono);color:var(--gray-500);cursor:pointer;border-radius:6px;transition:.15s}
.nav-lang button.on{background:#fff;color:var(--gray-900);box-shadow:var(--shadow-sm)}
.nav-donate{background:var(--orange);color:#fff;padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;transition:background .2s,transform .1s;display:inline-flex;align-items:center;gap:6px;border:none;font-family:var(--sans)}
.nav-donate:hover{background:var(--orange-h);transform:translateY(-1px)}

/* ══════════════════════════════════════════
   HERO
══════════════════════════════════════════ */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:#1a3025}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:.65}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,33,22,.85) 0%,rgba(11,33,22,.4) 50%,rgba(11,33,22,.2) 100%)}
.hero-content{position:relative;z-index:2;width:100%;max-width:var(--max-w);margin:0 auto;padding:120px var(--pad) 80px}
.hero-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.hero-eyebrow::before{content:'';width:28px;height:1px;background:var(--green-200)}
.hero-title{font-family:var(--serif);font-size:clamp(48px,7vw,96px);line-height:1.1;font-weight:600;color:#fff;letter-spacing:-.02em;margin-bottom:24px}
.hero-title span{color:rgba(255,255,255,.55);font-weight:300}
.hero-sub{font-size:clamp(15px,1.6vw,18px);color:rgba(255,255,255,.8);max-width:56ch;line-height:1.75;margin-bottom:40px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn-primary{background:var(--orange);color:#fff;padding:14px 28px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .15s;cursor:pointer;border:none;font-family:var(--sans)}
.btn-primary:hover{background:var(--orange-h);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:#fff;padding:14px 28px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.4);transition:border-color .2s,background .2s;cursor:pointer;font-family:var(--sans)}
.btn-ghost:hover{border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.08)}
.hero-badges{display:flex;gap:20px;margin-top:56px;flex-wrap:wrap}
.hero-badge{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 20px;display:flex;flex-direction:column;gap:4px}
.hero-badge .num{font-family:var(--serif);font-size:32px;font-weight:600;color:#fff;line-height:1}
.hero-badge .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}

/* ══════════════════════════════════════════
   MARQUEE
══════════════════════════════════════════ */
.marquee{background:var(--green-800);overflow:hidden;padding:14px 0}
.marquee-track{display:inline-flex;gap:40px;animation:mq 36s linear infinite;white-space:nowrap}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.marquee-item{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:500;color:rgba(255,255,255,.85);letter-spacing:.04em}
.marquee-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.marquee-sep{color:rgba(255,255,255,.3)}

/* ══════════════════════════════════════════
   SECTION COMMON
══════════════════════════════════════════ */
.section{padding:clamp(64px,8vw,120px) var(--pad)}
.section-inner{max-width:var(--max-w);margin:0 auto}
.section-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green-700);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section-eyebrow::before{content:'';width:20px;height:2px;background:var(--green-600);border-radius:2px}
.section-title{font-family:var(--serif);font-size:clamp(32px,4vw,52px);font-weight:600;line-height:1.15;letter-spacing:-.025em;color:var(--gray-900)}
.section-sub{font-size:16px;color:var(--gray-500);line-height:1.8;max-width:52ch;margin-top:14px}

/* ══════════════════════════════════════════
   IMPACT STATS
══════════════════════════════════════════ */
.stats{background:var(--white);border-top:1px solid var(--gray-300)}
.stats-grid{max-width:var(--max-w);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:44px 32px;border-right:1px solid var(--gray-300);position:relative}
.stat:last-child{border-right:none}
.stat-num{font-family:var(--serif);font-size:clamp(48px,5vw,72px);font-weight:700;color:var(--green-800);line-height:1;letter-spacing:-.03em}
.stat-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-500);margin-top:8px}
.stat-desc{font-size:13px;color:var(--gray-500);margin-top:6px;line-height:1.5}

/* ══════════════════════════════════════════
   PROGRAMS
══════════════════════════════════════════ */
.programs{background:var(--cream)}
.programs-header{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:48px;flex-wrap:wrap}
.programs-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.prog-card{border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s;position:relative}
.prog-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.prog-card.active{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.prog-card-inner{padding:28px 22px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between;transition:background .3s}
.prog-num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.6);margin-bottom:auto}
.prog-title{font-family:var(--serif);font-size:20px;font-weight:600;color:#fff;line-height:1.3;margin-top:16px}
.prog-tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:6px}
.prog-arrow{align-self:flex-end;font-size:18px;color:rgba(255,255,255,.5);transition:transform .2s,color .2s;margin-top:20px}
.prog-card:hover .prog-arrow,.prog-card.active .prog-arrow{transform:translateX(4px);color:rgba(255,255,255,.9)}
.prog-detail{margin-top:16px;border-radius:var(--radius);overflow:hidden;transition:background .4s;display:grid;grid-template-columns:1fr 1fr;min-height:260px}
.prog-detail-text{padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative}
.prog-detail-text::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 100% 0%,rgba(255,255,255,.12),transparent 60%)}
.prog-detail-body{position:relative;z-index:1}
.prog-detail-code{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:16px}
.prog-detail-title{font-family:var(--serif);font-size:clamp(28px,3vw,44px);font-weight:600;line-height:1.1;letter-spacing:-.02em;margin-bottom:16px}
.prog-detail-desc{font-size:16px;opacity:.9;line-height:1.75;max-width:44ch}
.prog-detail-footer{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center}
.prog-detail-link{background:rgba(255,255,255,.15);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .2s;backdrop-filter:blur(8px)}
.prog-detail-link:hover{background:rgba(255,255,255,.25)}
.prog-detail-count{font-family:var(--mono);font-size:11px;letter-spacing:.12em;opacity:.65;text-transform:uppercase}
.prog-detail-img{position:relative;overflow:hidden;background:#1a3025}
.prog-detail-img img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:.7;transition:transform .6s}
.prog-card:hover~.prog-detail .prog-detail-img img{transform:scale(1.04)}

/* ══════════════════════════════════════════
   ABOUT
══════════════════════════════════════════ */
.about{background:var(--white)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,80px);align-items:center}
.about-photo{border-radius:24px;overflow:hidden;position:relative;background:#e8e4df}
.about-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;display:block}
.about-content{}
.about-quote{font-family:var(--serif);font-size:clamp(24px,3vw,38px);font-weight:500;line-height:1.3;letter-spacing:-.02em;color:var(--gray-900);margin:20px 0 28px}
.about-quote span{color:var(--green-700)}
.about-body{font-size:15px;color:var(--gray-500);line-height:1.9;white-space:pre-line}
.about-sig{margin-top:32px;display:flex;align-items:center;gap:16px;padding-top:24px;border-top:1px solid var(--gray-300)}
.about-sig-line{width:32px;height:2px;background:var(--green-600);border-radius:2px;flex-shrink:0}
.about-sig-text{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--gray-700)}

/* ══════════════════════════════════════════
   REPORTS
══════════════════════════════════════════ */
.reports{background:var(--gray-100)}
.reports-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px;flex-wrap:wrap;gap:16px}
.reports-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.report-card{background:var(--white);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column}
.report-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.report-thumb{width:100%;height:160px;object-fit:cover;object-position:center;flex-shrink:0;background:var(--gray-100)}
.report-body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.report-meta{display:flex;justify-content:space-between;align-items:center}
.report-tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--green-50);color:var(--green-700);padding:4px 10px;border-radius:6px;font-weight:600}
.report-date{font-family:var(--mono);font-size:10px;color:var(--gray-500);letter-spacing:.06em}
.report-title{font-size:15px;font-weight:600;line-height:1.5;color:var(--gray-900);flex:1}
.report-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--green-700);font-weight:600;margin-top:auto;padding-top:12px;border-top:1px solid var(--gray-100)}

/* ══════════════════════════════════════════
   CTA / DONATE
══════════════════════════════════════════ */
.cta{background:var(--green-800);position:relative;overflow:hidden}
.cta::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 80% at 90% 50%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse 40% 60% at 10% 80%,rgba(0,0,0,.2),transparent 60%)}
.cta-inner{position:relative;z-index:1;max-width:var(--max-w);margin:0 auto;padding:clamp(64px,8vw,120px) var(--pad);display:grid;grid-template-columns:1.4fr 1fr;gap:60px;align-items:center}
.cta-tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cta-tag::before{content:'';width:20px;height:1px;background:rgba(255,255,255,.4)}
.cta-title{font-family:var(--serif);font-size:clamp(32px,4vw,56px);font-weight:600;color:#fff;line-height:1.15;letter-spacing:-.025em;margin-bottom:20px}
.cta-sub{font-size:16px;color:rgba(255,255,255,.75);line-height:1.75;max-width:44ch}
.cta-actions{display:flex;flex-direction:column;gap:12px}
.btn-cta-primary{background:#fff;color:var(--green-800);padding:16px 28px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .2s;cursor:pointer;border:none;font-family:var(--sans);justify-content:center}
.btn-cta-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.btn-cta-secondary{background:transparent;color:rgba(255,255,255,.85);padding:16px 28px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.3);transition:border-color .2s,background .2s;cursor:pointer;font-family:var(--sans);justify-content:center}
.btn-cta-secondary:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.07)}

/* ══════════════════════════════════════════
   ORG
══════════════════════════════════════════ */
.org{background:var(--white)}
.org-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--gray-300);border:1px solid var(--gray-300);border-radius:var(--radius);overflow:hidden;margin-top:40px}
.org-cell{background:var(--white);padding:24px 28px}
.org-cell.wide{grid-column:1/-1}
.org-key{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px}
.org-val{font-size:16px;font-weight:600;color:var(--gray-900);line-height:1.4}
.org-cell.wide .org-val{font-size:14px;font-weight:400;color:var(--gray-500);line-height:1.8}

/* ══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
.footer{background:var(--green-900);color:#fff;padding:clamp(48px,6vw,80px) var(--pad) 40px}
.footer-inner{max-width:var(--max-w);margin:0 auto}
.footer-tag{font-family:var(--serif);font-size:clamp(36px,5vw,72px);font-weight:600;line-height:1;letter-spacing:-.03em;color:rgba(255,255,255,.9);margin-bottom:60px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;padding-top:48px;border-top:1px solid rgba(255,255,255,.12)}
.footer-col h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:20px}
.footer-col p,.footer-col a{font-size:13px;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:8px;display:block;transition:color .2s}
.footer-col a:hover{color:#fff}
.footer-bottom{margin-top:48px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SITE = {

  programs:{

let state={lang:'jp',activeProgIdx:0};
let removeScroll=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function hueToColor(h,l=0.4,c=0.16){return `oklch(${l} ${c} ${h})`}

function buildPage(lang){
  const S=SITE,h=S.hero[lang],progs=S.programs[lang],ap=progs[state.activeProgIdx],ab=S.about[lang],ct=S.cta[lang],ft=S.footer[lang];

  const mqItems=progs.map(p=>`<span class="marquee-item"><span class="marquee-dot" style="background:${hueToColor(p.hue,.62,.15)}"></span>${esc(p.title)}<span class="marquee-sep"> / </span></span>`).join('');

  const progCards=progs.map((p,i)=>`
    <div class="prog-card${i===state.activeProgIdx?' active':''}" data-prog="${i}" style="background:${hueToColor(p.hue,.35,.16)}">
      <div class="prog-card-inner">
        <span class="prog-num">${esc(p.code)}</span>
        <div>
          <div class="prog-title">${esc(p.title)}</div>
          <div class="prog-tag">${esc(p.tag)}</div>
        </div>
        <div class="prog-arrow">→</div>
      </div>
    </div>`).join('');

  const orgRows=S.org[lang];

  return `
  <nav class="nav" id="main-nav">
    <div class="nav-logo">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 22 22" stroke-width="1.8">
          <circle cx="8" cy="11" r="5"/><circle cx="14" cy="11" r="5"/>
        </svg>
      </div>
      <div class="nav-logo-text">
        <div class="en">${esc(S.brand[lang].name)}</div>
        <div class="jp">${esc(S.brand[lang].suffix)}</div>
      </div>
    </div>
    <nav class="nav-links">
      ${S.nav[lang].map(n=>`<a href="#">${esc(n)}</a>`).join('')}
    </nav>
    <div class="nav-right">
      <div class="nav-lang">
        <button class="lang-btn${lang==='jp'?' on':''}" data-lang="jp">JP</button>
        <button class="lang-btn${lang==='en'?' on':''}" data-lang="en">EN</button>
      </div>
      <button class="nav-donate lang-btn" data-lang="${lang}">${esc(h.ctaPrimary)}</button>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-bg"><img src="image/LINE_ALBUM_20240909_241011_11.jpg" alt="活動の様子"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">${esc(h.eyebrow)}</p>
      <h1 class="hero-title">${esc(h.title1)}<br><span>${esc(h.title2)}</span></h1>
      <p class="hero-sub">${esc(h.sub)}</p>
      <div class="hero-actions">
        <button class="btn-primary">${esc(h.ctaPrimary)} →</button>
        <button class="btn-ghost">${esc(h.ctaSecondary)}</button>
      </div>
      <div class="hero-badges">
        ${S.stats[lang].map(s=>`<div class="hero-badge"><span class="num">${esc(s.num)}</span><span class="lab">${esc(s.label)}</span></div>`).join('')}
      </div>
    </div>
  </section>

  <div class="marquee">
    <div class="marquee-track">${mqItems}${mqItems}</div>
  </div>

  <div class="stats">
    <div class="stats-grid">
      ${S.stats[lang].map((s,i)=>`
        <div class="stat" data-reveal data-reveal-delay="${i}">
          <div class="stat-num">${esc(s.num)}</div>
          <div class="stat-label">${esc(s.label)}</div>
          <div class="stat-desc">${esc(s.desc)}</div>
        </div>`).join('')}
    </div>
  </div>

  <section class="section programs">
    <div class="section-inner">
      <div class="programs-header">
        <div data-reveal>
          <p class="section-eyebrow">${lang==='jp'?'事業内容':'Programs'}</p>
          <h2 class="section-title">${lang==='jp'?'5つの重点領域。':'Five focus areas.'}</h2>
          <p class="section-sub">${lang==='jp'?'定款に定める17分野を、5つの主軸へと束ねた重点プログラム。':'Our 17 chartered fields, woven into five focus programs.'}</p>
        </div>
      </div>
      <div class="programs-grid" id="prog-cards">${progCards}</div>
      <div class="prog-detail" id="prog-detail" style="background:${hueToColor(ap.hue,.35,.16)}">
        <div class="prog-detail-text">
          <div class="prog-detail-body">
            <div class="prog-detail-code" id="pd-code">—— ${esc(ap.code)} / ${esc(ap.tag)}</div>
            <h3 class="prog-detail-title" id="pd-title">${esc(ap.title)}</h3>
            <p class="prog-detail-desc" id="pd-body">${esc(ap.body)}</p>
          </div>
          <div class="prog-detail-footer">
            <a href="#" class="prog-detail-link">${lang==='jp'?'詳しく見る':'Learn more'} →</a>
            <span class="prog-detail-count" id="pd-count">0${state.activeProgIdx+1} / 0${progs.length}</span>
          </div>
        </div>
        <div class="prog-detail-img" id="pd-img">
          ${ap.img?`<img src="${ap.img}" alt="${esc(ap.title)}">`:''}
        </div>
      </div>
    </div>
  </section>

  <section class="section about">
    <div class="section-inner">
      <div class="about-grid">
        <div class="about-photo" data-reveal>
          <img src="image/01000092.png" alt="代表理事 古賀久達">
        </div>
        <div class="about-content" data-reveal data-reveal-delay="2">
          <p class="section-eyebrow">${esc(ab.eyebrow)}</p>
          <h2 class="about-quote">${ab.quote.split('\n').map(l=>`${esc(l)}`).join('<br><span>')}</h2>
          <p class="about-body">${esc(ab.body)}</p>
          <div class="about-sig">
            <div class="about-sig-line"></div>
            <span class="about-sig-text">${esc(ab.sig)}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 活動レポートセクション：コンテンツ確定後に表示 -->

  <section class="cta">
    <div class="cta-inner">
      <div data-reveal>
        <p class="cta-tag">${esc(ct.tag)}</p>
        <h2 class="cta-title">${ct.title.split('\n').map(l=>esc(l)).join('<br>')}</h2>
        <p class="cta-sub">${esc(ct.body)}</p>
      </div>
      <div class="cta-actions" data-reveal data-reveal-delay="2">
        <button class="btn-cta-primary">❤ ${esc(ct.primary)}</button>
        <button class="btn-cta-secondary">${esc(ct.secondary)} →</button>
      </div>
    </div>
  </section>

  <section class="section org">
    <div class="section-inner">
      <div data-reveal>
        <p class="section-eyebrow">${lang==='jp'?'法人概要':'Organization'}</p>
        <h2 class="section-title">${lang==='jp'?'法人について。':'About the org.'}</h2>
      </div>
      <div class="org-grid" data-reveal>
        ${orgRows.slice(0,-1).map(r=>`
          <div class="org-cell">
            <div class="org-key">${esc(r[0])}</div>
            <div class="org-val">${esc(r[1])}</div>
          </div>`).join('')}
        <div class="org-cell wide">
          <div class="org-key">${esc(orgRows[orgRows.length-1][0])}</div>
          <div class="org-val">${esc(orgRows[orgRows.length-1][1])}</div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-tag">${esc(ft.tag)}</div>
      <div class="footer-grid">
        <div class="footer-col">
          <h4>${esc(S.brand[lang].name)}</h4>
          <p>${esc(S.brand[lang].suffix)}</p>
          <p>${esc(ft.address)}</p>
          <p>info@globalbridge-npo.org</p>
        </div>
        <div class="footer-col">
          <h4>${lang==='jp'?'メニュー':'Menu'}</h4>
          ${S.nav[lang].map(n=>`<a href="#">${esc(n)}</a>`).join('')}
        </div>
        <div class="footer-col">
          <h4>${lang==='jp'?'関わる':'Get involved'}</h4>
          <a href="#">${esc(ct.primary)}</a>
          <a href="#">${esc(ct.secondary)}</a>
          <a href="#">${lang==='jp'?'お問い合わせ':'Contact'}</a>
        </div>
        <div class="footer-col">
          <h4>${lang==='jp'?'言語':'Language'}</h4>
          <a href="#" class="lang-btn" data-lang="jp">日本語</a>
          <a href="#" class="lang-btn" data-lang="en">English</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>${esc(ft.copy)}</span>
        <span>NPO · GLOBAL BRIDGE · SAGA</span>
      </div>
    </div>
  </footer>`;
}

function mount(){
  if(removeScroll)removeScroll();
  const lang=state.lang;
  document.documentElement.lang=lang==='jp'?'ja':'en';
  document.title=lang==='jp'?'NPO法人グローバルブリッジ — 境界を、橋に変える。':'Global Bridge NPO — Turning borders into bridges.';
  document.getElementById('app').innerHTML=buildPage(lang);

  const nav=document.getElementById('main-nav');
  function onScroll(){nav.classList.toggle('scrolled',window.scrollY>60);}
  window.addEventListener('scroll',onScroll,{passive:true});
  removeScroll=()=>window.removeEventListener('scroll',onScroll);
  onScroll();

  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.setAttribute('data-revealed','')});},{threshold:.1});
  document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));

  document.querySelectorAll('[data-prog]').forEach(card=>{
    card.addEventListener('click',()=>{
      const idx=+card.dataset.prog;
      state.activeProgIdx=idx;
      const p=SITE.programs[state.lang][idx];
      document.querySelectorAll('[data-prog]').forEach((c,j)=>c.classList.toggle('active',j===idx));
      const det=document.getElementById('prog-detail');
      det.style.background=hueToColor(p.hue,.35,.16);
      document.getElementById('pd-code').textContent=`—— ${p.code} / ${p.tag}`;
      document.getElementById('pd-title').textContent=p.title;
      document.getElementById('pd-body').textContent=p.body;
      document.getElementById('pd-count').textContent=`0${idx+1} / 0${SITE.programs[state.lang].length}`;
      document.getElementById('pd-img').innerHTML=p.img?`<img src="${p.img}" alt="${esc(p.title)}">`:'';
    });
  });

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.preventDefault();
      const nl=btn.dataset.lang;
      if(nl&&nl!==state.lang){const y=window.scrollY;state.lang=nl;mount();window.scrollTo(0,y);}
    });
  });
}

mount();
</script>
